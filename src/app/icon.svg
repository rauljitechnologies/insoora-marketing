<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 114 114" width="32" height="32" role="img" aria-label="Insoora">
  <!-- The Insoora symbol, SIMPLIFIED for icon sizes. Kept in step with
       components/brand.tsx, which carries the full-detail mark used at
       display sizes. The difference is the canopy: there the three panels
       are separate and the gaps between them are the umbrella ribs; here
       they are stroked in their own fill so the dome reads solid, because
       at 16px a 1.5-unit gap is a third of a pixel and only adds noise. The
       figures are stroked the same way: their arms taper to a point, and a
       point is what disappears first on the way down to a 16px tab. The
       gaps between the three are ~4 units, far wider than the stroke, so
       they stay three.

       The white tile is deliberate and exists only on the icon. A browser
       tab is light in one theme and near-black in the other; the tile keeps
       the mark legible in both, and on a light tab its edges do not show.

       favicon.ico and the raster app icons are rendered from this file by
       scripts/build-brand-icons.mts. -->
  <defs><linearGradient id="u" x1="4" y1="6" x2="96" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#DC2626"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="f" x1="10" y1="50" x2="90" y2="86" gradientUnits="userSpaceOnUse"><stop stop-color="#DC2626"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
